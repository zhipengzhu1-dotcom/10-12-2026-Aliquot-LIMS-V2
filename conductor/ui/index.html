<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliquot Conductor</title>
<style>
	:root {
		--bg: #fbfbfa;
		--fg: #1d1d1b;
		--muted: #6b6b66;
		--line: #deddd8;
		--accent: #2f5d8a;
		color-scheme: light dark;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #171716;
			--fg: #e8e7e3;
			--muted: #9a9993;
			--line: #33332f;
			--accent: #8fb6dd;
		}
	}
	body {
		margin: 0;
		background: var(--bg);
		color: var(--fg);
		font: 15px/1.5 system-ui, sans-serif;
	}
	header, main {
		max-width: 72rem;
		margin: 0 auto;
		padding: 0 1rem;
	}
	nav {
		display: flex;
		flex-wrap: wrap;
		gap: 0.25rem 1rem;
		padding: 0.75rem 0;
		border-bottom: 1px solid var(--line);
	}
	nav a { color: var(--muted); text-decoration: none; }
	nav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
	form {
		display: grid;
		grid-template-columns: 10rem 1fr auto;
		gap: 0.5rem;
		padding: 0.75rem 0;
	}
	form textarea { min-height: 2.5rem; font: 13px/1.4 ui-monospace, monospace; }
	output { grid-column: 1 / -1; color: var(--muted); }
	pre {
		overflow-x: auto;
		padding: 0.75rem;
		border: 1px solid var(--line);
		font: 13px/1.4 ui-monospace, monospace;
	}
	@media (max-width: 40rem) {
		form { grid-template-columns: 1fr; }
	}
</style>
</head>
<body>
<header>
	<nav></nav>
	<form id="action">
		<input name="verb" placeholder="action, such as pause" aria-label="Action" required>
		<textarea name="body" aria-label="Body as JSON" required>{"agent_id": "A-rin", "reason": "Too many retries"}</textarea>
		<button type="submit">Run</button>
		<output id="answer"></output>
	</form>
</header>
<main></main>
<script type="module" src="main.js"></script>
</body>
</html>
