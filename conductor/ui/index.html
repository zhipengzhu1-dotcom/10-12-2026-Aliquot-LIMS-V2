<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliquot Conductor</title>
<style>
	:root {
		--bg: #fbfbfa;
		--fg: #1d1d1b;
		--muted: #6b6b66;
		--line: #deddd8;
		--accent: #2f5d8a;
		--warn: #9a6200;
		--bad: #b3261e;
		color-scheme: light dark;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #171716;
			--fg: #e8e7e3;
			--muted: #9a9993;
			--line: #33332f;
			--accent: #8fb6dd;
			--warn: #e0b060;
			--bad: #f08a80;
		}
	}
	body {
		margin: 0;
		background: var(--bg);
		color: var(--fg);
		font: 15px/1.5 system-ui, sans-serif;
	}
	header, main {
		max-width: 72rem;
		margin: 0 auto;
		padding: 0 1rem;
	}
	nav {
		display: flex;
		flex-wrap: wrap;
		gap: 0.25rem 1rem;
		padding: 0.75rem 0;
		border-bottom: 1px solid var(--line);
	}
	nav a { color: var(--muted); text-decoration: none; }
	nav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
	form {
		display: grid;
		grid-template-columns: 10rem 1fr auto;
		gap: 0.5rem;
		padding: 0.75rem 0;
	}
	form textarea { min-height: 2.5rem; font: 13px/1.4 ui-monospace, monospace; }
	output { grid-column: 1 / -1; color: var(--muted); }
	pre {
		overflow-x: auto;
		padding: 0.75rem;
		border: 1px solid var(--line);
		font: 13px/1.4 ui-monospace, monospace;
	}
	@media (max-width: 40rem) {
		form { grid-template-columns: 1fr; }
	}
	button, input, select { font: inherit; }
	ul.org, ul.org ul { list-style: none; margin: 0; padding-left: 1.25rem; }
	ul.org { padding-left: 0; }
	ul.org ul { border-left: 1px solid var(--line); }
	.operator, .pool { padding: 0.35rem 0; color: var(--muted); }
	.agent {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 0.25rem 0.6rem;
		padding: 0.35rem 0;
	}
	.agent > a { color: var(--fg); font-weight: 600; }
	.role, .load-value { color: var(--muted); font-size: 13px; }
	.badge {
		padding: 0 0.45rem;
		border: 1px solid var(--line);
		border-radius: 999px;
		font-size: 12px;
	}
	.paused { color: var(--warn); border-color: currentColor; }
	meter.load { width: 6rem; }
	.agent details { flex-basis: 100%; }
	.agent summary { color: var(--muted); cursor: pointer; font-size: 13px; }
	.agent details form {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		padding: 0.25rem 0;
	}
	.agent details input { flex: 1 1 12rem; }
	form.act { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.25rem 0; }
	form.act input { flex: 1 1 12rem; }
	form.act textarea { flex: 1 1 100%; min-height: 4rem; }
	.facts { display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 1rem; margin: 0.5rem 0; }
	.facts dt { color: var(--muted); }
	.facts dd { margin: 0; overflow-wrap: anywhere; }
	.gate { padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
	.gate h3 { margin: 0.25rem 0; }
	.kind, .empty { color: var(--muted); }
	.state-open { color: var(--accent); border-color: currentColor; }
	.state-rejected, .state-expired { color: var(--warn); border-color: currentColor; }
	ul.gates { list-style: none; padding: 0; }
	ol.chat { list-style: none; padding: 0; margin: 0.5rem 0; }
	.message { padding: 0.4rem 0; border-bottom: 1px solid var(--line); }
	.message .body { margin: 0.2rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
	table.diff, table.rows { border-collapse: collapse; font-size: 13px; margin: 0.5rem 0; }
	table.diff th, table.diff td, table.rows th, table.rows td {
		padding: 0.25rem 0.5rem;
		border-bottom: 1px solid var(--line);
		text-align: left;
		vertical-align: top;
	}
	table.diff td { font-family: ui-monospace, monospace; }
	.actions { padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
	.actions summary { color: var(--muted); cursor: pointer; }
	svg.merit polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
	svg.merit circle { fill: var(--accent); }
	.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
	.verdict.broken { color: var(--bad); font-weight: 600; }
	main { overflow-x: auto; }
	table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
	table.ledger th, table.ledger td {
		padding: 0.3rem 0.5rem;
		border-bottom: 1px solid var(--line);
		text-align: left;
		vertical-align: top;
	}
	table.ledger td { white-space: nowrap; }
	table.ledger td:first-child, .cause { font-variant-numeric: tabular-nums; }
	table.ledger td:last-child { width: 100%; max-width: 0; }
	table.ledger summary {
		overflow: hidden;
		text-overflow: ellipsis;
		cursor: pointer;
		font: 12px/1.4 ui-monospace, monospace;
		color: var(--muted);
	}
	table.ledger pre { margin: 0.25rem 0 0; white-space: pre-wrap; }
	nav.pages { display: flex; gap: 1rem; padding: 0.75rem 0; border: 0; }
</style>
<style>
	/* Flow and Performance. Series colours follow each Agent's Recruitment order. */
	:root {
		--surface: #ffffff;
		--warn: #b54708;
		--s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
		--s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--surface: #1f1f1e;
			--warn: #f79009;
			--s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
			--s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
		}
	}
	main h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
	main h2 { font-size: 1rem; margin: 1.25rem 0 0.5rem; }
	.muted, .count, .empty, .note { color: var(--muted); }
	.count { font-weight: 400; }
	a.button {
		display: inline-block;
		padding: 0.3rem 0.75rem;
		border: 1px solid var(--accent);
		border-radius: 6px;
		color: var(--accent);
		text-decoration: none;
	}
	form.filter {
		display: flex;
		flex-wrap: wrap;
		align-content: center;
		gap: 0.5rem 1rem;
		padding: 0 0 0.5rem;
	}
	.flow.with-panel {
		display: grid;
		grid-template-columns: minmax(0, 1fr) minmax(0, 30rem);
		gap: 1rem;
	}
	.lane { border-top: 1px solid var(--line); }
	.cards {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
		gap: 0.5rem;
		margin: 0 0 0.75rem;
		padding: 0;
		list-style: none;
	}
	.card {
		display: grid;
		gap: 0.1rem;
		padding: 0.5rem 0.65rem;
		border: 1px solid var(--line);
		border-radius: 8px;
		background: var(--surface);
		color: inherit;
		text-decoration: none;
	}
	.card[aria-current] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
	.card-head { display: flex; justify-content: space-between; gap: 0.5rem; }
	.card-title { overflow-wrap: anywhere; }
	.card-meta { color: var(--muted); font-size: 13px; }
	.state { font-size: 12px; color: var(--muted); }
	.state[data-state="Done"] { color: var(--s6); }
	.state[data-state="Failed"], .state[data-state="Escalated"] { color: var(--warn); }
	.panel {
		position: sticky;
		align-self: start;
		top: 0;
		max-height: 100vh;
		overflow: auto;
		border-left: 1px solid var(--line);
		padding-left: 1rem;
	}
	.panel h2 { display: flex; justify-content: space-between; }
	.events { display: grid; grid-template-columns: auto minmax(0, 1fr); }
	.events ol { margin: 0; padding: 0; list-style: none; font: 13px ui-monospace, monospace; }
	.events li {
		height: var(--row);
		line-height: var(--row);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.events li.outside { color: var(--muted); }
	.events .seq { display: inline-block; min-width: 2.5em; text-align: right; color: var(--muted); }
	.events .cause { color: var(--muted); }
	.arrows path { fill: none; stroke: var(--accent); stroke-width: 1.5; }
	.arrows marker path { fill: var(--accent); stroke: none; }
	.chart { width: 100%; height: auto; max-width: 48rem; }
	.chart .grid { stroke: var(--line); }
	.chart .axis { fill: var(--muted); font-size: 11px; }
	.s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
	.s5 { --c: var(--s5); } .s6 { --c: var(--s6); } .s7 { --c: var(--s7); } .s8 { --c: var(--s8); }
	.s-other { --c: var(--muted); }
	.series .trend { fill: none; stroke: var(--c); stroke-width: 2; }
	.series .point { fill: var(--c); stroke: var(--bg); stroke-width: 2; }
	.legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; padding: 0; list-style: none; }
	.swatch { display: inline-block; width: 0.75rem; height: 0.75rem; margin-right: 0.35rem; border-radius: 50%; background: var(--c); }
	.rubric { border-collapse: collapse; font-variant-numeric: tabular-nums; }
	.rubric th, .rubric td { padding: 0.25rem 0.75rem; border-bottom: 1px solid var(--line); text-align: left; }
	.rubric td { position: relative; min-width: 5rem; }
	.cell-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
	.meter { position: relative; height: 0.9rem; border-radius: 4px; background: var(--line); max-width: 48rem; }
	.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
	.budget[data-over] .meter .fill { background: var(--warn); }
	.meter .line { position: absolute; top: -0.25rem; bottom: -0.25rem; width: 2px; background: var(--fg); }
	.states { display: grid; gap: 0.25rem; max-width: 36rem; padding: 0; list-style: none; }
	.states li { display: grid; grid-template-columns: 7rem 1fr 2.5rem; gap: 0.5rem; }
	.states li > * { align-self: center; }
	.states .track { height: 0.6rem; }
	.states .bar { display: block; height: 100%; min-width: 1px; border-radius: 3px; background: var(--accent); }
	.states b { text-align: right; font-variant-numeric: tabular-nums; }
	@media (max-width: 56rem) {
		.flow.with-panel { grid-template-columns: 1fr; }
		.panel { order: -1; position: static; max-height: none; border-left: 0; padding-left: 0; }
	}
	@media (max-width: 40rem) {
		.rubric { display: block; overflow-x: auto; }
	}
</style>
</head>
<body>
<header>
	<nav></nav>
	<form id="action">
		<input name="verb" placeholder="action, such as pause" aria-label="Action" required>
		<textarea name="body" aria-label="Body as JSON" required>{"agent_id": "A-rin", "reason": "Too many retries"}</textarea>
		<button type="submit">Run</button>
		<output id="answer"></output>
	</form>
</header>
<main></main>
<script type="module" src="main.js"></script>
</body>
</html>
