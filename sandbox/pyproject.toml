[project]
name = "sandbox"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
]

[project.scripts]
synth = "synth.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synth"
module-root = ""

[dependency-groups]
dev = [
    "pdfplumber==0.11.10",
    "pytest==9.1.1",
    "reportlab==5.0.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
