name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conductor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: conductor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: conductor/pnpm-lock.yaml
      - run: pnpm -C conductor install --frozen-lockfile
      - run: pnpm -C conductor lint
      - run: pnpm -C conductor typecheck
      # The runner tests build this image too; building it first makes theirs a cache hit.
      - run: docker build -f sandbox/Dockerfile -t aliquot-sandbox:test sandbox
      - run: pnpm -C conductor test
      # Stage 1 on every Fixture: the job goes red when any Evaluation fails.
      - run: pnpm -C conductor cli --home "$RUNNER_TEMP/aliquot" stage1 run-all "$GITHUB_WORKSPACE/fixtures"

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.12"
          working-directory: sandbox
          enable-cache: true
      - run: uv sync --directory sandbox --locked
      - run: uv run --directory sandbox ruff check .
      - run: uv run --directory sandbox ruff format --check .
      - run: uv run --directory sandbox pytest
      - run: uv run --directory sandbox synth --seed 42 --out "$RUNNER_TEMP/synth-42"
      - run: docker build -f sandbox/Dockerfile -t aliquot-sandbox:ci sandbox
