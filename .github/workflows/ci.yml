name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conductor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: conductor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: conductor/pnpm-lock.yaml
      # Lint, typecheck, the Sandbox image build, vitest, then stage 1 on every
      # Fixture and ledger verify; the job goes red when any Evaluation fails.
      - run: tools/check.sh --conductor-only

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.12"
          working-directory: sandbox
          enable-cache: true
      # Sync, ruff check, ruff format --check, pytest, and the synthetic generator.
      # The forbidden real terms live only in a repository secret (ADR-0009).
      - run: tools/check.sh --sandbox-only
        env:
          ALIQUOT_FORBIDDEN_TERMS: ${{ secrets.ALIQUOT_FORBIDDEN_TERMS }}
